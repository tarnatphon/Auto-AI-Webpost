name: Tests

# Tests for the engine itself.
# (This is NOT the publishing scheduler - that template lives in
#  .github/workflow-templates/autopost.yml and is copied to .github/workflows/
#  by scripts/mac-setup.sh on your Mac.)

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: |
          set -o pipefail
          pytest tests/ --cov=autowebpost --cov-report=term-missing --tb=short 2>&1 | tee pytest.log

      - name: Upload test log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-log-py${{ matrix.python-version }}
          path: pytest.log

      - name: Smoke-test the CLI (offline)
        env:
          AUTOWEBPOST_PROVIDER: template
        run: |
          python -m autowebpost.cli --version
          python -m autowebpost.cli sites --api-only
          python -m autowebpost.cli persona
          python -m autowebpost.cli generate --topic "CI smoke test" --no-images

      - name: Verify the generated draft
        run: |
          python - <<'PY'
          import json, pathlib, re, sys
          folders = sorted(pathlib.Path("output/drafts").glob("*ci-smoke-test*"))
          if not folders:
              sys.exit("generate produced no draft folder")
          folder = folders[-1]
          for name in ("article.md", "seo.jsonld.txt", "review-checklist.md"):
              if not (folder / name).exists():
                  sys.exit(f"missing sidecar: {name}")
          blob = (folder / "seo.jsonld.txt").read_text()
          blocks = [b for b in re.split(r"^<!--.*?-->\s*$", blob, flags=re.M) if b.strip()]
          types = {json.loads(b)["@type"] for b in blocks}
          if "BlogPosting" not in types:
              sys.exit(f"no BlogPosting JSON-LD emitted, got {types}")
          print("draft OK:", folder.name, "| schema:", sorted(types))
          PY
