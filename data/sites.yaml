# Auto-AI-WebPost curated catalog - free, high-authority publishing platforms
# Research: 2026 (sources linked in docs/01-research-report.md)
# da = approximate Domain Authority | api: free = official free API
#       pro = API behind paid tier | none = manual publishing only
# publisher = implemented adapter slug in autowebpost/platforms/

- slug: githubpages
  name: GitHub Pages
  url: https://pages.github.com
  signup_url: https://github.com/signup
  da: 96
  dofollow: true
  api: free
  api_docs: https://docs.github.com/en/rest/repos/contents
  publisher: githubpages
  category: origin-site
  best_for: "Your OWN origin site - canonical URL source, full SEO control"
  notes: "The keystone. Jekyll blog on <user>.github.io, free forever, dofollow, you own the domain option."
  env_keys: [GITHUB_TOKEN, GITHUB_REPO]

- slug: blogger
  name: Blogger
  url: https://www.blogger.com
  signup_url: https://www.blogger.com/go/signup
  da: 96
  dofollow: true
  api: free
  api_docs: https://developers.google.com/blogger/docs/3.0/reference/posts/insert
  publisher: blogger
  category: web20-blog
  best_for: "Google-trusted blogs, very fast indexing, AdSense option"
  notes: "OAuth2 token needed (Google OAuth Playground). Posts created as drafts by default."
  env_keys: [BLOGGER_ACCESS_TOKEN, BLOGGER_BLOG_ID]

- slug: wordpress
  name: WordPress (.com / self-hosted)
  url: https://wordpress.com
  signup_url: https://wordpress.com/start
  da: 93
  dofollow: true
  api: free
  api_docs: https://developer.wordpress.org/rest-api/reference/posts/
  publisher: wordpress
  category: web20-blog
  best_for: "Long-form articles, most flexible free tier, Yoast SEO on self-hosted"
  notes: "Application Passwords auth. Works with any self-hosted WP too - ideal if you later get your own domain."
  env_keys: [WP_SITE, WP_USER, WP_APP_PASSWORD]

- slug: medium
  name: Medium
  url: https://medium.com
  signup_url: https://medium.com/m/signin
  da: 95
  dofollow: false
  api: manual-assist
  api_docs: ""
  publisher: medium
  category: web20-blog
  best_for: "Biggest built-in audience; brand visibility"
  notes: "Public API retired (2025-26). Use 'Import a story' with canonical URL - adapter prepares everything. Never copy-paste (duplicate content)."

- slug: tumblr
  name: Tumblr
  url: https://www.tumblr.com
  signup_url: https://www.tumblr.com/register
  da: 91
  dofollow: true
  api: free
  api_docs: https://www.tumblr.com/docs/en/api/v2
  publisher: tumblr
  category: web20-blog
  best_for: "Visual/micro content, dofollow links, creative niches"
  notes: "OAuth1 (one-time 'connect tumblr' flow). DA ~91 and links are followed."
  env_keys: [TUMBLR_CONSUMER_KEY, TUMBLR_CONSUMER_SECRET, TUMBLR_BLOG]

- slug: telegraph
  name: Telegra.ph
  url: https://telegra.ph
  signup_url: https://telegra.ph
  da: 88
  dofollow: true
  api: free
  api_docs: https://telegra.ph/api
  publisher: telegraph
  category: instant-webpost
  best_for: "Instant anonymous web posts - zero signup, instant pages"
  notes: "The fastest free webpost on the internet. No account at all; token auto-created. Great for announcements + supporting content clusters."
