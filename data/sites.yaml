# ---- Platforms in the catalog worth posting to MANUALLY (no public/free API) ----

- slug: linkedin
  name: LinkedIn Articles
  url: https://www.linkedin.com
  signup_url: https://www.linkedin.com/signup
  da: 98
  dofollow: false
  api: none
  category: social
  best_for: "B2B authority building - highest DA on this list"
  notes: "UGC post API needs LinkedIn partner approval. Manual republishing with canonical URL works fine and indexes in hours."

- slug: substack
  name: Substack
  url: https://substack.com
  signup_url: https://substack.com/signup
  da: 86
  dofollow: true
  api: none
  category: newsletter
  best_for: "Email newsletter + public blog hybrid, free forever"
  notes: "No public API. Manual cross-posting after origin publish; newsletter builds the audience that Google can't take away."

- slug: quora
  name: Quora (Spaces)
  url: https://www.quora.com
  signup_url: https://www.quora.com
  da: 93
  dofollow: false
  api: none
  category: q-a
  best_for: "Answer question keywords directly; long-tail traffic"
  notes: "Manual. Answer real questions (2-3/week) referencing your article - strong referral traffic, builds author entity."

- slug: reddit
  name: Reddit
  url: https://www.reddit.com
  signup_url: https://www.reddit.com/register
  da: 94
  dofollow: false
  api: free
  api_docs: https://www.reddit.com/dev/api/#POST_api_submit
  publisher: reddit
  category: community
  best_for: "Niche subreddits - discovery and feedback, NOT link drops"
  notes: "Official OAuth API adapter present, but posting is public and heavily policed. Read subreddit rules, post value, do not bulk-link. Requires a script app at /prefs/apps."
